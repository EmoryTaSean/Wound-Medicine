<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Capitol Checkout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2b0b08 0%, #110302 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(223, 74, 59, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(223, 74, 59, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        .page-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .checkout-view {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.95) 0%, rgba(15, 15, 15, 0.98) 100%);
            border: 1px solid #df4a3b;
            color: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            text-align: center;
        }

        .checkout-view h3 {
            margin-top: 0;
            color: #df4a3b;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .order-summary {
            background-color: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid #df4a3b;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            border-radius: 6px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #df4a3b;
        }

        .submit-order-btn {
            width: 100%;
            background: #df4a3b;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666666;
            text-decoration: none;
        }

        .back-link:hover {
            color: #df4a3b;
        }

        .footer-banner {
            background: linear-gradient(90deg, rgba(226, 99, 86, 0.15), rgba(184, 50, 39, 0.15));
            border: 1px solid rgba(226, 99, 86, 0.2);
            padding: 20px;
            text-align: center;
            border-radius: 12px;
        }

        .footer-banner h2 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e26356;
        }

        .contact-info {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="checkout-view">
            <h3>Secure Capitol Checkout</h3>
            <div class="order-summary">
                <strong>SECURE_LINE:</strong> APPROVED<br>
                <strong>ITEM:</strong> WOUND CARE CONTAINER CELL<br>
                <strong>SPONSOR TAX:</strong> $120.00
            </div>

            <form action="index.html" onsubmit="alert('TRANSMISSION SUCCESSFUL! Your sponsor parcel has been authorized. Deploying silver parachute cargo immediately.')">
                <div class="form-group">
                    <label>Sponsor Identity</label>
                    <input type="text" placeholder="Enter Sponsor Name" required>
                </div>
                <div class="form-group">
                    <label>Target Coordinates</label>
                    <select>
                        <option>District 1 (Luxury)</option>
                        <option>District 2 (Masonry)</option>
                        <option>District 4 (Fishing)</option>
                        <option>District 11 (Agriculture)</option>
                        <option>District 12 (Mining)</option>
                    </select>
                </div>
                <button type="submit" class="submit-order-btn">Deploy Parachute</button>
                <a href="index.html" class="back-link">← ABORT_DEPLOYMENT</a>
            </form>
        </div>

        <div class="footer-banner">
            <h2>RECOVERY CARE v4.0</h2>
            <div class="contact-info">OPERATOR: TASEAN EMORY | FREQ: +800-965-3248</div>
        </div>
    </div>

</body>
</html>
