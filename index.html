<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitol Supply - Wound Medicine</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2b0b08 0%, #110302 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(223, 74, 59, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(223, 74, 59, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            pointer-events: none;
        }

        .page-wrapper {
            width: 100%;
            max-width: 650px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .scifi-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #df4a3b, transparent);
            height: 1px;
            width: 80%;
            top: 0;
            left: 10%;
            opacity: 0.5;
            box-shadow: 0 0 10px #df4a3b;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: stretch;
            margin-bottom: 30px;
        }

        .hidden-view {
            display: none !important;
        }

        .left-column {
            background: linear-gradient(135deg, rgba(223, 74, 59, 0.15) 0%, rgba(184, 50, 39, 0.05) 100%);
            border: 1px solid rgba(223, 74, 59, 0.3);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(223, 74, 59, 0.1);
        }

        .sys-status {
            color: #ff9f43;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .cursive-title {
            font-weight: 400;
            font-size: 0.9rem;
            color: #df4a3b;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
        }

        .bold-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 5px 0 20px 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .product-image-container {
            width: 100%;
            height: 160px;
            border-radius: 8px;
            background-color: rgba(17, 3, 2, 0.8);
            border: 1px solid rgba(223, 74, 59, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .med-icon {
            width: 80px;
            height: 80px;
            fill: #df4a3b;
            filter: drop-shadow(0px 0px 8px #df4a3b);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .right-column {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.8) 0%, rgba(15, 15, 15, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pitch-text {
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0 0 15px 0;
            color: #dddddd;
        }

        .highlight-price {
            color: #2ecc71;
            font-size: 1.3rem;
            text-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
            font-weight: bold;
        }

        .tech-spec-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            font-size: 0.8rem;
            color: #888888;
            text-align: left;
        }

        .tech-spec-list li {
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }

        .tech-spec-list span {
            color: #df4a3b;
            float: right;
        }

        .shop-now-btn {
            background: linear-gradient(90deg, #df4a3b, #b83227);
            color: #ffffff;
            padding: 14px 20px;
            font-weight: 700;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(223, 74, 59, 0.4);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }

        .shop-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(223, 74, 59, 0.7);
            filter: brightness(1.2);
        }

        .checkout-view {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #df4a3b;
            color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(223, 74, 59, 0.2);
            margin-bottom: 30px;
        }

        .checkout-view h3 {
            margin-top: 0;
            color: #df4a3b;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .order-summary {
            background-color: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
            border-left: 4px solid #df4a3b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            border-radius: 6px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #df4a3b;
        }

        .submit-order-btn {
            width: 100%;
            background: #df4a3b;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .submit-order-btn:hover {
            background-color: #b83227;
            box-shadow: 0 0 15px rgba(223, 74, 59, 0.5);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666666;
            text-decoration: none;
            cursor: pointer;
        }

        .back-link:hover {
            color: #df4a3b;
        }

        .footer-banner {
            background: linear-gradient(90deg, rgba(226, 99, 86, 0.2), rgba(184, 50, 39, 0.2));
            border: 1px solid rgba(226, 99, 86, 0.3);
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .footer-banner h2 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e26356;
        }

        .contact-info {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 1px;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0px 0px 5px #df4a3b); opacity: 0.8; }
            50% { filter: drop-shadow(0px 0px 20px #df4a3b); opacity: 1; }
            100% { filter: drop-shadow(0px 0px 5px #df4a3b); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="scifi-line"></div>
        
        <!-- MAIN DESIGN PANEL -->
        <div class="grid-layout" id="mainView">
            <div class="left-column">
                <span class="sys-status">// CAPITOL_SYS_ONLINE</span>
                <h3 class="cursive-title">Best Selling</h3>
                <h1 class="bold-title">Product</h1>
                
                <div class="product-image-container">
                    <svg class="med-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                        <path d="M19 8h-2V5c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v3H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2ZM9 5h6v3H9V5Zm4 11h-2v2H9v-2H7v-2h2v-2h2v2h2v2Z"/>
                    </svg>
                </div>
            </div>

            <div class="right-column">
                <div>
                    <p class="pitch-text">
